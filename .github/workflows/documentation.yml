name: Documentation

on:
  push:
    branches: [main]
    paths: ['**.md', '**.rst', '**.txt']
  pull_request:
    paths: ['**.md', '**.rst', '**.txt']

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install markdownlint
      run: npm install -g markdownlint-cli

    - name: Lint markdown files
      run: |
        # Find all markdown files and lint them
        markdownlint **/*.md || true

  spell-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install codespell
      run: pip install codespell

    - name: Check spelling
      run: codespell --skip "*.json,*.yaml,*.yml,*.db" --ignore-words ".github/codespell-ignore.txt" .
      continue-on-error: true

  link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install link checker
      run: pip install markdown-link-extractor requests

    - name: Check external links in documentation
      run: |
        python -c "
        import re
        import requests
        from pathlib import Path
        
        # Find all markdown files
        md_files = list(Path('.').rglob('*.md'))
        
        # Extract URLs from markdown files
        urls = []
        for md_file in md_files:
            with open(md_file, 'r', encoding='utf-8') as f:
                content = f.read()
                # Find markdown links
                for match in re.finditer(r'\[.*?\]\((https?://[^)]+)\)', content):
                    urls.append(match.group(1))
        
        # Test URLs (skip localhost and example.com)
        valid_urls = [url for url in urls if not any(skip in url for skip in ['localhost', 'example.com', '127.0.0.1'])]
        
        print(f'Found {len(valid_urls)} external URLs to check')
        for url in valid_urls[:10]:  # Check first 10 to avoid rate limiting
            try:
                response = requests.head(url, timeout=5, allow_redirects=True)
                if response.status_code >= 400:
                    print(f'⚠️  Broken link: {url} ({response.status_code})')
                else:
                    print(f'✅ OK: {url}')
            except Exception as e:
                print(f'⚠️  Error checking {url}: {e}')
        " || true