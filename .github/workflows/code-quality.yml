name: Code Quality

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install linting tools
      run: |
        pip install ruff black mypy

    - name: Run ruff linter
      run: ruff check .
      continue-on-error: true

    - name: Run black formatter check
      run: black --check .
      continue-on-error: true

    - name: Run mypy type checker
      run: mypy --ignore-missing-imports .
      continue-on-error: true

  formatting:
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install black
      run: pip install black

    - name: Check formatting with black
      run: black --check .

  import-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Test imports
      run: |
        python -c "
        # Test all main imports
        import chess_llm
        from agents.harnesses import get_harness, BaseAgentHarness
        from agents.agent_player_integration import AgentHarnessPlayer, parse_agent_harness_spec
        from agents.harnesses.hermes import HermesAgentHarness
        from agents.harnesses.opencode import OpenCodeAgentHarness
        from agents.harnesses.vibe_cli import VibeCLIAgentHarness
        print('✅ All imports successful')
        "